<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAYL STUDIO</title>
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Lo studio è installabile: sul dock ci finisce la faccia di Zack, e
         `start_url` apre direttamente qui, non sulla presentazione. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Type system JAYL: Space Grotesk display/UI, Cormorant Garamond editoriale. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- svgcanvas types through this off-screen input; it must exist in the DOM. -->
    <input id="svgcanvas-text-input" style="width: 0; height: 0; opacity: 0; position: fixed" />
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
